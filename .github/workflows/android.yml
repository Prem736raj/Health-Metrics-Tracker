name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m
        -XX:+UseParallelGC -Dfile.encoding=UTF-8

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Run Lint
      run: ./gradlew lintRelease --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Build Release App Bundle
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload verification reports and artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-verification-${{ github.run_number }}
        if-no-files-found: ignore
        path: |
          app/build/reports/**
          app/build/test-results/**
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m
        -XX:+UseParallelGC -Dfile.encoding=UTF-8

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        ram-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: ./gradlew connectedDebugAndroidTest --stacktrace

    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-reports-${{ github.run_number }}
        if-no-files-found: ignore
        path: |
          app/build/reports/androidTests/**
          app/build/outputs/androidTest-results/**
